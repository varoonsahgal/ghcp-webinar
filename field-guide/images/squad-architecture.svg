<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a371f7"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f85149"/></marker>
  </defs>
  <rect width="1200" height="640" rx="16" fill="#0d1117"/>
  <text x="40" y="46" fill="#e6edf3" font-size="22" font-weight="700">The Agent Squad: one prompt, five specialists, zero lost pennies</text>
  <text x="40" y="72" fill="#8b949e" font-size="14">java-agent-squad · Session Target: Local · Agent: Tech Lead</text>

  <!-- hooks band -->
  <rect x="30" y="92" width="1140" height="40" rx="8" fill="#d29922" fill-opacity="0.10" stroke="#d29922" stroke-dasharray="6 4"/>
  <text x="48" y="117" fill="#e3b341" font-size="14" font-weight="700">HOOKS (workspace)</text>
  <text x="200" y="117" fill="#e6edf3" font-size="14">audit.json → every prompt, tool call and subagent logged to timeline.log · guardrails.json → blocks rm -rf, git push, deploy, edits to hooks</text>

  <!-- user -->
  <g transform="translate(40,170)">
    <rect width="180" height="70" rx="12" fill="#161b22" stroke="#8b949e"/>
    <text x="90" y="30" fill="#e6edf3" text-anchor="middle" font-weight="700" font-size="16">You</text>
    <text x="90" y="52" fill="#8b949e" text-anchor="middle" font-size="13">"Get the nightly batch</text>
    <text x="90" y="66" fill="#8b949e" text-anchor="middle" font-size="13">audit-ready."</text>
  </g>
  <path d="M220 205 H330" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>

  <!-- tech lead -->
  <g transform="translate(335,160)">
    <rect width="300" height="92" rx="14" fill="#a371f7" fill-opacity="0.18" stroke="#a371f7" stroke-width="2"/>
    <text x="150" y="32" fill="#d2a8ff" text-anchor="middle" font-weight="700" font-size="19">Tech Lead</text>
    <text x="150" y="54" fill="#e6edf3" text-anchor="middle" font-size="13">coordinator · tools: agent, edit, execute</text>
    <text x="150" y="74" fill="#8b949e" text-anchor="middle" font-size="12">tech-lead.agent.md</text>
  </g>

  <!-- phase labels -->
  <g font-size="12" font-weight="700" letter-spacing="1">
    <text x="40" y="430" fill="#8b949e">↑ PHASE 1 · RECON (PARALLEL, READ-ONLY) · PHASE 2 · TRIAGE INTO ONE TABLE</text>
    <text x="40" y="452" fill="#8b949e">PHASE 3 · PROVE IT (RED)</text>
    <text x="440" y="452" fill="#8b949e">PHASE 4 · FIX IT (GREEN)</text>
    <text x="800" y="452" fill="#8b949e">PHASE 5 · HANDOFF (HUMAN CLICK)</text>
  </g>

  <!-- parallel subagents -->
  <g stroke="#a371f7" stroke-width="2" fill="none">
    <path d="M430 252 C 430 290, 140 280, 140 318" marker-end="url(#ap)"/>
    <path d="M485 252 V318" marker-end="url(#ap)"/>
    <path d="M540 252 C 540 290, 830 280, 830 318" marker-end="url(#ap)"/>
  </g>
  <g font-size="13">
    <g transform="translate(40,320)">
      <rect width="200" height="90" rx="12" fill="#f85149" fill-opacity="0.12" stroke="#f85149"/>
      <text x="100" y="30" fill="#ffa198" text-anchor="middle" font-weight="700" font-size="16">Bug Hunter</text>
      <text x="100" y="52" fill="#e6edf3" text-anchor="middle">money &amp; date bugs</text>
      <text x="100" y="72" fill="#8b949e" text-anchor="middle">tools: read, search</text>
    </g>
    <g transform="translate(385,320)">
      <rect width="200" height="90" rx="12" fill="#d29922" fill-opacity="0.12" stroke="#d29922"/>
      <text x="100" y="30" fill="#e3b341" text-anchor="middle" font-weight="700" font-size="16">Security Auditor</text>
      <text x="100" y="52" fill="#e6edf3" text-anchor="middle">secrets, PII in logs</text>
      <text x="100" y="72" fill="#8b949e" text-anchor="middle">tools: read, search</text>
    </g>
    <g transform="translate(730,320)">
      <rect width="200" height="90" rx="12" fill="#3fb950" fill-opacity="0.12" stroke="#3fb950"/>
      <text x="100" y="30" fill="#7ee787" text-anchor="middle" font-weight="700" font-size="16">Java Modernizer</text>
      <text x="100" y="52" fill="#e6edf3" text-anchor="middle">java.time, records</text>
      <text x="100" y="72" fill="#8b949e" text-anchor="middle">tools: read, search</text>
    </g>
  </g>
  <!-- skills box -->
  <g transform="translate(965,160)">
    <rect width="195" height="250" rx="12" fill="#161b22" stroke="#3fb950" stroke-dasharray="5 4"/>
    <text x="97" y="30" fill="#7ee787" text-anchor="middle" font-weight="700" font-size="15">SKILLS (on demand)</text>
    <text x="16" y="62" fill="#e6edf3" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace">money-handling</text>
    <text x="16" y="82" fill="#8b949e" font-size="12">BigDecimal, HALF_EVEN,</text>
    <text x="16" y="98" fill="#8b949e" font-size="12">lossless splits + script</text>
    <text x="16" y="132" fill="#e6edf3" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace">junit5-tests</text>
    <text x="16" y="152" fill="#8b949e" font-size="12">red → green conventions</text>
    <text x="16" y="190" fill="#8b949e" font-size="12">Loaded only when a task</text>
    <text x="16" y="206" fill="#8b949e" font-size="12">matches the description,</text>
    <text x="16" y="222" fill="#8b949e" font-size="12">by lead or subagents.</text>
  </g>
  <path d="M635 200 H960" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- phase 3/4/5 -->
  <g font-size="13">
    <g transform="translate(40,466)">
      <rect width="340" height="84" rx="12" fill="#2f81f7" fill-opacity="0.12" stroke="#2f81f7"/>
      <text x="170" y="30" fill="#79c0ff" text-anchor="middle" font-weight="700" font-size="16">Test Engineer (subagent)</text>
      <text x="170" y="52" fill="#e6edf3" text-anchor="middle">writes failing JUnit 5 tests, edits src/test only</text>
      <text x="170" y="70" fill="#8b949e" text-anchor="middle">uses skill: junit5-tests</text>
    </g>
    <g transform="translate(440,466)">
      <rect width="320" height="84" rx="12" fill="#a371f7" fill-opacity="0.18" stroke="#a371f7"/>
      <text x="160" y="30" fill="#d2a8ff" text-anchor="middle" font-weight="700" font-size="16">Tech Lead fixes src/main</text>
      <text x="160" y="52" fill="#e6edf3" text-anchor="middle">BigDecimal, java.time, hashCode, masking</text>
      <text x="160" y="70" fill="#8b949e" text-anchor="middle">uses skill: money-handling</text>
    </g>
    <g transform="translate(800,466)">
      <rect width="360" height="84" rx="12" fill="#161b22" stroke="#8b949e"/>
      <text x="180" y="30" fill="#e6edf3" text-anchor="middle" font-weight="700" font-size="16">"Independent code review" button</text>
      <text x="180" y="52" fill="#e6edf3" text-anchor="middle">→ Code Reviewer (disable-model-invocation)</text>
      <text x="180" y="70" fill="#8b949e" text-anchor="middle">"Draft the pull request" → Agent</text>
    </g>
  </g>
  <path d="M380 508 H435" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <path d="M760 508 H795" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>

  <!-- quality gate loop -->
  <path d="M600 550 C 600 600, 720 600, 720 575 C 720 560, 700 556, 690 553" stroke="#f85149" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <text x="440" y="612" fill="#ffa198" font-size="13" font-weight="700">Stop hook (agent-scoped): mvn test red → "You are not done." → loops back</text>
</svg>
