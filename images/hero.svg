<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="0.55" stop-color="#161b33"/><stop offset="1" stop-color="#2a1458"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a371f7"/><stop offset="1" stop-color="#2f81f7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#a371f7" stop-opacity="0.35"/><stop offset="1" stop-color="#a371f7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="380" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="20" fill="url(#glow)"/>
  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0 76H1200M0 152H1200M0 228H1200M0 304H1200"/>
    <path d="M150 0V380M300 0V380M450 0V380M600 0V380M750 0V380M900 0V380M1050 0V380"/>
  </g>
  <text x="60" y="78" fill="#a371f7" font-size="18" font-weight="600" letter-spacing="3">HANDS-ON LAB · OCTOBER 2026 EDITION · 2 HOURS</text>
  <text x="60" y="140" fill="#e6edf3" font-size="50" font-weight="700">GitHub Copilot in VS Code</text>
  <text x="60" y="198" fill="url(#accent)" font-size="40" font-weight="700">From chat modes to agent squads</text>
  <text x="60" y="244" fill="#8b949e" font-size="20">Ask · Plan · Agent · Context window · Skills · Hooks · Custom agents · Subagents · Logs</text>
